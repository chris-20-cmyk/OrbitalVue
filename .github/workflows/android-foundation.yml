name: Android foundation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "platforms/android/**"
      - "contracts/**"
      - "store/**"
      - "tools/verify-premium-store-readiness.mjs"
      - "tools/verify-cross-platform-release-contract.mjs"
      - "tools/verify-android-plex-account-foundation.mjs"
      - ".github/workflows/android-foundation.yml"
  pull_request:
    paths:
      - "platforms/android/**"
      - "contracts/**"
      - "store/**"
      - "tools/verify-premium-store-readiness.mjs"
      - "tools/verify-cross-platform-release-contract.mjs"
      - "tools/verify-android-plex-account-foundation.mjs"
      - ".github/workflows/android-foundation.yml"

permissions:
  contents: read

jobs:
  contract:
    name: Portable catalog contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out OrbitalVue
        uses: actions/checkout@v7
      - name: Validate contract fixtures
        run: |
          node contracts/validate-contract.mjs
          node tools/verify-premium-store-readiness.mjs
          node tools/verify-cross-platform-release-contract.mjs
          node tools/verify-android-plex-account-foundation.mjs

  android:
    name: Android and Google TV
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out OrbitalVue
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 37.1
        run: sdkmanager "platforms;android-37.1" "build-tools;37.0.0" "platform-tools"
      - name: Test, lint, and package Android
        run: >-
          bash platforms/android/gradlew -p platforms/android
          testDebugUnitTest
          lintDebug
          assembleDebug
          --stacktrace
      - name: Build the fail-closed Google Play configuration
        run: |
          bash platforms/android/gradlew -p platforms/android bundleRelease -PorbitalVueDistributionMode=store --stacktrace
          grep -F 'DISTRIBUTION_MODE = "store"' platforms/android/app/build/generated/source/buildConfig/release/com/orbitalvue/player/BuildConfig.java
          verification="$(jarsigner -verify platforms/android/app/build/outputs/bundle/release/app-release.aab 2>&1)"
          if grep -Fq 'jar verified.' <<< "$verification"; then
            echo 'Foundation Store bundle unexpectedly contains a release signature.' >&2
            exit 1
          fi
          grep -Fq 'jar is unsigned' <<< "$verification"
          mkdir -p artifacts/android
          cp platforms/android/app/build/outputs/bundle/release/app-release.aab artifacts/android/OrbitalVue-5.7.0-alpha.1-google-play-store-locked-unsigned.aab
      - name: Verify Android TV metadata and 16 KB alignment
        run: |
          APK="platforms/android/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt2" dump badging "$APK" | grep "leanback-launchable-activity"
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/zipalign" -c -P 16 -v 4 "$APK"
      - name: Upload install and store packages
        uses: actions/upload-artifact@v7
        with:
          name: orbitalvue-android-5.7-foundation
          if-no-files-found: error
          retention-days: 14
          path: |
            platforms/android/app/build/outputs/apk/debug/app-debug.apk
            artifacts/android/OrbitalVue-5.7.0-alpha.1-google-play-store-locked-unsigned.aab
            platforms/android/app/build/reports/tests/testDebugUnitTest/
            platforms/android/app/build/reports/lint-results-debug.html
