name: Build Windows Store candidate

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Four-part MSIX version; the fourth part must be zero
        required: true
        default: 5.1.0.0

permissions:
  contents: read

jobs:
  store-candidate:
    name: Partner Center upload candidate
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      WINDOWS_IDENTITY_NAME: ${{ vars.STREAMVUE_WINDOWS_IDENTITY_NAME }}
      WINDOWS_PUBLISHER: ${{ vars.STREAMVUE_WINDOWS_PUBLISHER }}
      WINDOWS_PUBLISHER_DISPLAY_NAME: ${{ vars.STREAMVUE_WINDOWS_PUBLISHER_DISPLAY_NAME }}
      WINDOWS_PREMIUM_PRODUCT_ID: ${{ vars.STREAMVUE_WINDOWS_PREMIUM_PRODUCT_ID }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
    steps:
      - name: Check out StreamVue
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Require exact Partner Center configuration
        shell: pwsh
        run: |
          $required = @{
            STREAMVUE_WINDOWS_IDENTITY_NAME = $env:WINDOWS_IDENTITY_NAME
            STREAMVUE_WINDOWS_PUBLISHER = $env:WINDOWS_PUBLISHER
            STREAMVUE_WINDOWS_PUBLISHER_DISPLAY_NAME = $env:WINDOWS_PUBLISHER_DISPLAY_NAME
            STREAMVUE_WINDOWS_PREMIUM_PRODUCT_ID = $env:WINDOWS_PREMIUM_PRODUCT_ID
          }
          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object Key)
          if ($missing.Count -gt 0) {
            throw "Missing required repository variables: $($missing -join ', ')"
          }
          node tools/verify-premium-store-readiness.mjs `
            --require-ready windows `
            --expect-product-id windows $env:WINDOWS_PREMIUM_PRODUCT_ID `
            --expect-verification-provider windows microsoft-store-license

      - name: Restore the Store dependency graph
        shell: pwsh
        run: |
          dotnet restore src/StreamVue.Player/StreamVue.Player.csproj `
            -p:StreamVueDistributionMode=Store `
            "-p:StreamVuePremiumProductId=$env:WINDOWS_PREMIUM_PRODUCT_ID"

      - name: Build and inspect the unsigned Store package
        shell: pwsh
        run: |
          ./tools/build-windows-msix.ps1 `
            -IdentityName $env:WINDOWS_IDENTITY_NAME `
            -Publisher $env:WINDOWS_PUBLISHER `
            -PublisherDisplayName $env:WINDOWS_PUBLISHER_DISPLAY_NAME `
            -Version $env:PACKAGE_VERSION `
            -PremiumProductId $env:WINDOWS_PREMIUM_PRODUCT_ID `
            -SkipRestore
          Get-FileHash -Algorithm SHA256 -LiteralPath "artifacts/windows-msix/StreamVue-$($env:PACKAGE_VERSION)-win-x64-microsoft-store-unsigned.msix" |
            ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } |
            Set-Content -LiteralPath artifacts/windows-msix/SHA256SUMS.txt -Encoding utf8

      - name: Upload the Partner Center candidate
        uses: actions/upload-artifact@v7
        with:
          name: streamvue-windows-store-${{ inputs.package_version }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/windows-msix/StreamVue-${{ inputs.package_version }}-win-x64-microsoft-store-unsigned.msix
            artifacts/windows-msix/SHA256SUMS.txt
