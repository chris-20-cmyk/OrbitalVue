name: Publish Preview Assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag
        required: true
        default: v5.7.0-alpha.1
      package_version:
        description: Velopack package version
        required: true
        default: 5.7.0-alpha.1
      base_release_tag:
        description: Previous release containing the base full package
        required: true
        default: v5.6.0-alpha.1
      base_package_name:
        description: Previous full package filename
        required: true
        default: Chris.OrbitalVue-5.6.0-alpha.1-full.nupkg

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
      BASE_RELEASE_TAG: ${{ inputs.base_release_tag }}
      BASE_PACKAGE_NAME: ${{ inputs.base_package_name }}

    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore OrbitalVue.Native.slnx

      - name: Verify the release
        shell: pwsh
        run: |
          node tools/verify-premium-store-readiness.mjs
          node tools/verify-windows-plex-account-foundation.mjs
          node tools/verify-windows-media-center-progress.mjs
          node tools/verify-windows-media-center-artwork.mjs
          dotnet build OrbitalVue.Native.slnx -c Release --no-restore
          dotnet restore src/OrbitalVue.Player/OrbitalVue.Player.csproj -p:OrbitalVueDistributionMode=Store
          dotnet build src/OrbitalVue.Player/OrbitalVue.Player.csproj -c Release --no-restore -p:OrbitalVueDistributionMode=Store
          dotnet restore src/OrbitalVue.Player/OrbitalVue.Player.csproj -p:OrbitalVueDistributionMode=Personal
          dotnet build src/OrbitalVue.Player/OrbitalVue.Player.csproj -c Release --no-restore -p:OrbitalVueDistributionMode=Personal
          dotnet run --project tools/OrbitalVue.FeatureProbe/OrbitalVue.FeatureProbe.csproj -c Release --no-build
          dotnet run --project tools/OrbitalVue.PlaylistProbe/OrbitalVue.PlaylistProbe.csproj -c Release --no-build -- --routing-scale 70000

      - name: Publish the Windows application
        run: dotnet publish src/OrbitalVue.Player/OrbitalVue.Player.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/orbitalvue-publish

      - name: Install Velopack
        run: dotnet tool install vpk --version 1.2.0 --tool-path .tools

      - name: Build installer and update packages
        shell: pwsh
        run: |
          $releaseDirectory = Join-Path $PWD 'artifacts/orbitalvue-releases'
          New-Item -ItemType Directory -Path $releaseDirectory -Force | Out-Null
          gh release download $env:BASE_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $env:BASE_PACKAGE_NAME --dir $releaseDirectory
          .\.tools\vpk.exe pack `
            --packId Chris.OrbitalVue `
            --packVersion $env:PACKAGE_VERSION `
            --packDir artifacts/orbitalvue-publish `
            --mainExe OrbitalVue.exe `
            --packTitle OrbitalVue `
            --packAuthors Chris `
            --icon src/OrbitalVue.Player/Assets/orbitalvue.ico `
            --releaseNotes RELEASE_NOTES.md `
            --outputDir $releaseDirectory `
            --runtime win-x64

      - name: Prove the incremental update reconstructs the full package
        shell: pwsh
        run: |
          $releaseDirectory = Join-Path $PWD 'artifacts/orbitalvue-releases'
          $basePackage = Join-Path $releaseDirectory $env:BASE_PACKAGE_NAME
          $deltaPackage = Join-Path $releaseDirectory "Chris.OrbitalVue-$($env:PACKAGE_VERSION)-delta.nupkg"
          $fullPackage = Join-Path $releaseDirectory "Chris.OrbitalVue-$($env:PACKAGE_VERSION)-full.nupkg"
          $reconstructed = Join-Path $PWD 'artifacts/reconstructed-full.nupkg'
          .\.tools\vpk.exe delta patch --base $basePackage --patch $deltaPackage --output $reconstructed
          $expected = (Get-FileHash -Algorithm SHA256 -LiteralPath $fullPackage).Hash
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $reconstructed).Hash
          if ($expected -ne $actual) {
            throw "Delta reconstruction mismatch: $actual != $expected"
          }

      - name: Upload every release asset to the existing draft
        shell: pwsh
        run: |
          $assets = Get-ChildItem -LiteralPath artifacts/orbitalvue-releases -File | Select-Object -ExpandProperty FullName
          gh release upload $env:RELEASE_TAG $assets --repo $env:GITHUB_REPOSITORY --clobber
