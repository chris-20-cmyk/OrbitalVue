name: Build Google Play candidate

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: New positive Play version code (must never have been uploaded before)
        required: true
        default: "5200001"
      version_name:
        description: User-visible release version
        required: true
        default: 5.8.0-alpha.3

permissions:
  contents: read

jobs:
  play-candidate:
    name: Upload-key signed Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_PREMIUM_PRODUCT_ID: ${{ vars.ORBITALVUE_ANDROID_PREMIUM_PRODUCT_ID }}
      ANDROID_PREMIUM_VERIFICATION_URL: ${{ vars.ORBITALVUE_ANDROID_PREMIUM_VERIFICATION_URL }}
      ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ORBITALVUE_ANDROID_UPLOAD_CERT_SHA256 }}
      PLAY_VERSION_CODE: ${{ inputs.version_code }}
      PLAY_VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - name: Check out OrbitalVue
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37.1
        run: sdkmanager "platforms;android-37.1" "build-tools;37.0.0" "platform-tools"

      - name: Require exact Play Console and verification configuration
        shell: bash
        run: |
          required=(
            ANDROID_PREMIUM_PRODUCT_ID
            ANDROID_PREMIUM_VERIFICATION_URL
            ANDROID_UPLOAD_CERT_SHA256
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required Google Play repository variables: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          node tools/verify-cross-platform-release-contract.mjs
          node tools/verify-android-plex-account-foundation.mjs
          node tools/verify-privacy-readiness.mjs --require-ready android
          node tools/verify-public-site-readiness.mjs --require-ready
          node tools/verify-store-listing-readiness.mjs --require-ready android
          node tools/verify-accessibility-readiness.mjs --require-ready android
          node tools/verify-premium-store-readiness.mjs \
            --require-ready android \
            --expect-product-id android "$ANDROID_PREMIUM_PRODUCT_ID" \
            --expect-verification-provider android google-play-developer-api
          node tools/verify-premium-verifier-readiness.mjs \
            --require-ready android \
            --expect-url android "$ANDROID_PREMIUM_VERIFICATION_URL"

      - name: Restore the protected upload keystore
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ORBITALVUE_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_UPLOAD_KEYSTORE_BASE64" ]]; then
            echo 'Missing required Google Play secret: ORBITALVUE_ANDROID_UPLOAD_KEYSTORE_BASE64' >&2
            exit 1
          fi
          umask 077
          keystore_path="$RUNNER_TEMP/orbitalvue-google-play-upload.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          if [[ ! -s "$keystore_path" ]]; then
            echo 'The decoded upload keystore is empty.' >&2
            exit 1
          fi
          echo "ORBITALVUE_ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Test and build the signed Store bundle
        shell: bash
        env:
          ORBITALVUE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ORBITALVUE_ANDROID_UPLOAD_STORE_PASSWORD }}
          ORBITALVUE_ANDROID_KEY_ALIAS: ${{ secrets.ORBITALVUE_ANDROID_UPLOAD_KEY_ALIAS }}
          ORBITALVUE_ANDROID_KEY_PASSWORD: ${{ secrets.ORBITALVUE_ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          required=(
            ORBITALVUE_ANDROID_KEYSTORE_PASSWORD
            ORBITALVUE_ANDROID_KEY_ALIAS
            ORBITALVUE_ANDROID_KEY_PASSWORD
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required Google Play signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          bash platforms/android/gradlew -p platforms/android \
            testDebugUnitTest \
            lintDebug \
            bundleRelease \
            -PorbitalVueDistributionMode=store \
            -PorbitalVuePremiumProductId="$ANDROID_PREMIUM_PRODUCT_ID" \
            -PorbitalVuePremiumVerificationUrl="$ANDROID_PREMIUM_VERIFICATION_URL" \
            -PorbitalVueVersionCode="$PLAY_VERSION_CODE" \
            -PorbitalVueVersionName="$PLAY_VERSION_NAME" \
            -PorbitalVueRequireStoreSigning=true \
            --stacktrace

      - name: Verify bundle identity, entitlement inputs, and upload signature
        shell: bash
        run: |
          bundle='platforms/android/app/build/outputs/bundle/release/app-release.aab'
          build_config='platforms/android/app/build/generated/source/buildConfig/release/com/orbitalvue/player/BuildConfig.java'
          test -s "$bundle"
          grep -F 'DISTRIBUTION_MODE = "store"' "$build_config"
          grep -F "PREMIUM_PRODUCT_ID = \"$ANDROID_PREMIUM_PRODUCT_ID\"" "$build_config"
          grep -F "PREMIUM_VERIFICATION_URL = \"$ANDROID_PREMIUM_VERIFICATION_URL\"" "$build_config"
          grep -F "VERSION_CODE = $PLAY_VERSION_CODE" "$build_config"
          grep -F "VERSION_NAME = \"$PLAY_VERSION_NAME\"" "$build_config"

          verification="$(jarsigner -verify "$bundle" 2>&1)"
          if ! grep -Fq 'jar verified.' <<< "$verification"; then
            printf '%s\n' "$verification" >&2
            exit 1
          fi
          if unzip -Z1 "$bundle" | grep -Eiq '\.(jks|keystore|p12|pfx)$'; then
            echo 'A private signing file was packaged into the Android App Bundle.' >&2
            exit 1
          fi

          certificate="$RUNNER_TEMP/orbitalvue-upload-certificate.pem"
          keytool -printcert -rfc -jarfile "$bundle" > "$certificate"
          actual_fingerprint="$(openssl x509 -in "$certificate" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected_fingerprint="$(tr -d ':' <<< "$ANDROID_UPLOAD_CERT_SHA256" | tr '[:lower:]' '[:upper:]')"
          if [[ ! "$expected_fingerprint" =~ ^[0-9A-F]{64}$ || "$actual_fingerprint" != "$expected_fingerprint" ]]; then
            echo 'The bundle was not signed by the registered Google Play upload certificate.' >&2
            exit 1
          fi
          key_bits="$(openssl x509 -in "$certificate" -noout -text | sed -nE 's/.*Public-Key: \(([0-9]+) bit\).*/\1/p' | head -n 1)"
          if [[ -z "$key_bits" || "$key_bits" -lt 2048 ]]; then
            echo 'The Google Play upload key must be RSA 2048 bits or stronger.' >&2
            exit 1
          fi

          output_dir='artifacts/google-play'
          mkdir -p "$output_dir"
          output_bundle="$output_dir/OrbitalVue-$PLAY_VERSION_NAME-$PLAY_VERSION_CODE-google-play-upload.aab"
          cp "$bundle" "$output_bundle"
          (cd "$output_dir" && sha256sum "$(basename "$output_bundle")" > SHA256SUMS.txt)
          printf '%s\n' "$actual_fingerprint" > "$output_dir/UPLOAD_CERT_SHA256.txt"

      - name: Remove the restored upload keystore
        if: always()
        shell: bash
        run: |
          if [[ -n "${ORBITALVUE_ANDROID_KEYSTORE_PATH:-}" && "$ORBITALVUE_ANDROID_KEYSTORE_PATH" == "$RUNNER_TEMP/"* ]]; then
            rm -f -- "$ORBITALVUE_ANDROID_KEYSTORE_PATH"
          fi

      - name: Upload the manual Play Console candidate
        uses: actions/upload-artifact@v7
        with:
          name: orbitalvue-google-play-${{ inputs.version_name }}-${{ inputs.version_code }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/google-play/
            store/store-listing.json
            store/accessibility-readiness.json
            store/public-site-readiness.json
            store/listing-assets/android/**
