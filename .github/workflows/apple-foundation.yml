name: Apple foundation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "platforms/apple/**"
      - "contracts/**"
      - ".github/workflows/apple-foundation.yml"
  pull_request:
    paths:
      - "platforms/apple/**"
      - "contracts/**"
      - ".github/workflows/apple-foundation.yml"

permissions:
  contents: read

jobs:
  contract:
    name: Portable catalog contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out StreamVue
        uses: actions/checkout@v7
      - name: Validate contract fixtures
        run: node contracts/validate-contract.mjs

  apple:
    name: iPhone, iPad, and Apple TV
    needs: contract
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out StreamVue
        uses: actions/checkout@v7

      - name: Select the App Store toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Install pinned XcodeGen
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          sudo "$RUNNER_TEMP/xcodegen/install.sh"
          xcodegen --version | grep -F "Version: 2.46.0"

      - name: Generate the Xcode project
        working-directory: platforms/apple
        run: xcodegen generate --spec project.yml

      - name: Test the shared Swift catalog and source layer
        run: swift test --package-path platforms/apple --parallel

      - name: Validate the privacy manifest
        run: plutil -lint platforms/apple/Resources/PrivacyInfo.xcprivacy

      - name: Validate the iOS app icon master
        shell: bash
        run: |
          ICON="platforms/apple/Apps/iOS/Assets.xcassets/AppIcon.appiconset/StreamVue-AppIcon-1024.png"
          test "$(sips -g pixelWidth "$ICON" | awk '/pixelWidth/ {print $2}')" = "1024"
          test "$(sips -g pixelHeight "$ICON" | awk '/pixelHeight/ {print $2}')" = "1024"
          test "$(sips -g hasAlpha "$ICON" | awk '/hasAlpha/ {print $2}')" = "no"

      - name: Build iPhone and iPad
        shell: bash
        run: |
          xcodebuild \
            -quiet \
            -jobs 2 \
            -project platforms/apple/StreamVueApple.xcodeproj \
            -scheme StreamVue \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath artifacts/apple-derived-data/ios \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            SWIFT_ENABLE_BATCH_MODE=NO \
            build

      - name: Analyze iPhone and iPad
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -jobs 2 \
            -project platforms/apple/StreamVueApple.xcodeproj \
            -scheme StreamVue \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath artifacts/apple-derived-data/ios \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            SWIFT_ENABLE_BATCH_MODE=NO \
            analyze | xcbeautify

      - name: Build Apple TV
        shell: bash
        run: |
          xcodebuild \
            -quiet \
            -jobs 2 \
            -project platforms/apple/StreamVueApple.xcodeproj \
            -scheme StreamVueTV \
            -destination "generic/platform=tvOS Simulator" \
            -derivedDataPath artifacts/apple-derived-data/tvos \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            SWIFT_ENABLE_BATCH_MODE=NO \
            build

      - name: Analyze Apple TV
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -jobs 2 \
            -project platforms/apple/StreamVueApple.xcodeproj \
            -scheme StreamVueTV \
            -destination "generic/platform=tvOS Simulator" \
            -derivedDataPath artifacts/apple-derived-data/tvos \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            SWIFT_ENABLE_BATCH_MODE=NO \
            analyze | xcbeautify

      - name: Verify simulator products without distributing them
        run: |
          test -d artifacts/apple-derived-data/ios/Build/Products/Debug-iphonesimulator/StreamVue.app
          test -d artifacts/apple-derived-data/tvos/Build/Products/Debug-appletvsimulator/StreamVueTV.app
          echo "KSPlayer-enabled binaries stay inside CI until StreamVue selects a compatible distribution license."
