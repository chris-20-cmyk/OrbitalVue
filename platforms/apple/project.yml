name: StreamVueApple

options:
  bundleIdPrefix: com.streamvue
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"

packages:
  StreamVueModules:
    path: .

settings:
  base:
    MARKETING_VERSION: 5.1.0
    CURRENT_PROJECT_VERSION: 5010001
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic

targets:
  StreamVue:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: StreamVueModules
        product: StreamVueUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamvue.player
        PRODUCT_NAME: StreamVue
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: Apps/iOS/StreamVue.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/StreamVue-Info.plist
      properties:
        CFBundleDisplayName: StreamVue
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: StreamVue connects to IPTV, Plex, and Emby servers that you choose on your local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  StreamVueTV:
    type: application
    platform: tvOS
    sources:
      - path: Apps/tvOS
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: StreamVueModules
        product: StreamVueUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamvue.player.tv
        PRODUCT_NAME: StreamVueTV
        CODE_SIGN_ENTITLEMENTS: Apps/tvOS/StreamVueTV.entitlements
    info:
      path: Generated/StreamVueTV-Info.plist
      properties:
        CFBundleDisplayName: StreamVue
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: StreamVue connects to IPTV, Plex, and Emby servers that you choose on your local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
        UIUserInterfaceStyle: Dark

schemes:
  StreamVue:
    build:
      targets:
        StreamVue: all
  StreamVueTV:
    build:
      targets:
        StreamVueTV: all
